name: Feature request
description: Suggest a focused improvement to the native SenseNova ComfyUI workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: What workflow or limitation should be improved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the node inputs, outputs, or behavior you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain any current workaround or related ComfyUI node you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request is for local SenseNova inference or its native ComfyUI integration.
          required: true
