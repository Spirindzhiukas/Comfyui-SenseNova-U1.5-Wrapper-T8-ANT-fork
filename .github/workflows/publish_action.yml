name: Publish to Comfy Registry

on:
  workflow_dispatch:
    inputs:
      changelog_only:
        description: Update Registry release notes and listing metadata without publishing again
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.changelog_only != true }}
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
      - name: Add release notes to Registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "Could not read project version from pyproject.toml." >&2
            exit 1
          fi
          changelog="$(python - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = re.escape(sys.argv[1])
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(rf"^## \[{version}\].*?\n(.*?)(?=^## \[|\Z)", text, re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"No CHANGELOG.md section found for {sys.argv[1]}")
          print(match.group(1).strip())
          PY
          )"

          version_id=""
          for attempt in {1..12}; do
            version_id="$(curl --fail --silent --show-error \
              "https://api.comfy.org/nodes/sensenova-u15-t8/versions" \
              | jq -r --arg version "$version" '.[] | select(.version == $version) | .id' \
              | head -n 1)"
            if [[ -n "$version_id" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$version_id" ]]; then
            echo "Registry version $version was not visible after publication." >&2
            exit 1
          fi

          payload="$(jq -n --arg changelog "$changelog" '{changelog: $changelog, deprecated: false}')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $REGISTRY_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.comfy.org/publishers/t8star/nodes/sensenova-u15-t8/versions/$version_id"
      - name: Update Registry listing metadata
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          publisher_payload="$(jq -n '{
            name: "T8star-Aix",
            description: "ComfyUI nodes and AI model resources by T8star-Aix.",
            website: "https://huggingface.co/t8star",
            source_code_repo: "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8"
          }')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $REGISTRY_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$publisher_payload" \
            "https://api.comfy.org/publishers/t8star"

          node_payload="$(jq -n '{
            name: "SenseNova U1.5 (T8)",
            category: "image-generation",
            description: "Native ComfyUI nodes for SenseNova-U1.5 text-to-image generation and multi-reference image editing.",
            author: "T8star-Aix",
            repository: "https://github.com/T8mars/Comfyui-SenseNova-U1.5-Wrapper-T8",
            tags: ["comfyui", "sensenova", "image-generation", "image-editing", "multi-reference"]
          }')"
          curl --fail-with-body --silent --show-error \
            --request PUT \
            --header "Authorization: Bearer $REGISTRY_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$node_payload" \
            "https://api.comfy.org/publishers/t8star/nodes/sensenova-u15-t8"
