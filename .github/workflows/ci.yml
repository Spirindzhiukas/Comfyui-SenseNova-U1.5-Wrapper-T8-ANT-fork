name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.comfyui.label }}, Python ${{ matrix.comfyui.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comfyui:
          - label: minimum ComfyUI 0.31
            ref: cbbc9dab1f03d0d9a6caa8a8be7d77a7e37e1e44
            python: "3.12"
          - label: current stable ComfyUI 0.33.1
            ref: v0.33.1
            python: "3.12"
          - label: current stable ComfyUI 0.33.1
            ref: v0.33.1
            python: "3.13"
    steps:
      - name: Check out tested ComfyUI
        uses: actions/checkout@v7
        with:
          repository: comfyanonymous/ComfyUI
          ref: ${{ matrix.comfyui.ref }}
          path: ComfyUI
      - name: Check out node
        uses: actions/checkout@v7
        with:
          path: ComfyUI/custom_nodes/comfyui-sensenova-u15-T8
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.comfyui.python }}
          cache: pip
          cache-dependency-path: ComfyUI/requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r ComfyUI/requirements.txt
      - name: Validate Python sources
        run: python -m compileall -q .
        working-directory: ComfyUI/custom_nodes/comfyui-sensenova-u15-T8
      - name: Run schema, TOML, example and no-weight tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd().parents[1]))

          from comfy.cli_args import args

          args.cpu = True
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
        working-directory: ComfyUI/custom_nodes/comfyui-sensenova-u15-T8
